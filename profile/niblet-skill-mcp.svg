<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="niblet-skill-mcp, with a screen-frame emblem: real screen references and a design skill for coding agents that build UI. Contract, build, check. References: find_ui_references. Materials: find_ui_materials. System: get_design_reference. Local: niblet_help, niblet_status.">
