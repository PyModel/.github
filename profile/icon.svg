<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">PyModel icon</title>
  <desc id="desc">Low-poly geodesic mark of PyModel in teal, blue, indigo, and violet on deep ink</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101218"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27d5c9"/>
      <stop offset="0.5" stop-color="#2e8fe8"/>
      <stop offset="1" stop-color="#7b63e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2e8fe8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2e8fe8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="320" height="320" fill="url(#bg)"/>
  <rect width="320" height="320" fill="url(#glow)"/>

  <g transform="translate(160,160) scale(1.55)">
    <polygon points="-44.7,-68.75 44.7,-68.75 72.3,16.25 0,68.75 -72.3,16.25" fill="none" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round" filter="url(#soft)" opacity="0.7"/>
    <g stroke="#0b0c10" stroke-width="2" stroke-linejoin="round">
      <polygon points="0,-7.25 0,-45.25 -36.1,-18.95" fill="#4addd2"/>
      <polygon points="0,-7.25 -36.1,-18.95 -22.3,23.45" fill="#2e8fe8"/>
      <polygon points="0,-7.25 -22.3,23.45 22.3,23.45" fill="#4a4fb5"/>
      <polygon points="0,-7.25 22.3,23.45 36.1,-18.95" fill="#7b63e6"/>
      <polygon points="0,-7.25 36.1,-18.95 0,-45.25" fill="#6fb4f2"/>
      <polygon points="0,-45.25 -44.7,-68.75 -36.1,-18.95" fill="#27d5c9"/>
      <polygon points="-36.1,-18.95 -72.3,16.25 -22.3,23.45" fill="#2578c9"/>
      <polygon points="-22.3,23.45 0,68.75 22.3,23.45" fill="#3b3f9e"/>
      <polygon points="22.3,23.45 72.3,16.25 36.1,-18.95" fill="#8f7aec"/>
      <polygon points="36.1,-18.95 44.7,-68.75 0,-45.25" fill="#56a8f0"/>
      <polygon points="-44.7,-68.75 -36.1,-18.95 -72.3,16.25" fill="#1fb8ad"/>
      <polygon points="-72.3,16.25 -22.3,23.45 0,68.75" fill="#343887"/>
      <polygon points="0,68.75 22.3,23.45 72.3,16.25" fill="#6a52d8"/>
      <polygon points="72.3,16.25 36.1,-18.95 44.7,-68.75" fill="#9784f0"/>
      <polygon points="44.7,-68.75 0,-45.25 -44.7,-68.75" fill="#2fc2db"/>
    </g>
  </g>
</svg>
