<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="40%" stop-color="#050505" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    
    <!-- Subtle Golden Glow Behind Text -->
    <radialGradient id="glow-bg" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFAED" />
      <stop offset="25%" stop-color="#F2D184" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="gold-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFAED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Text -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Bloom for Gold elements -->
    <filter id="bloom">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      <![CDATA[
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 88px;
        font-weight: 800;
        fill: url(#gold-grad);
        letter-spacing: -3px;
        filter: url(#shadow);
      }
      
      .subtitle {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 20px;
        font-weight: 400;
        fill: #A1A1AA;
        letter-spacing: 0px;
      }
      
      .eyebrow {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #D4AF37;
        letter-spacing: 4px;
        text-transform: uppercase;
        opacity: 0;
        animation: fadeIn 1s forwards 0.5s;
      }

      .cursor {
        fill: #D4AF37;
        animation: blink 1s step-end infinite;
      }
      
      .line-h {
        stroke: #D4AF37;
        stroke-opacity: 0.15;
        stroke-width: 1;
      }
      
      .line-glow {
        fill: url(#gold-grad-light);
        opacity: 0;
      }

      /* Animations */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes slideRight {
        from { opacity: 0; transform: translateX(-40px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes sweep {
        0% { transform: translateX(-100%); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(100%); opacity: 0; }
      }

      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(40px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.98); }
        50% { opacity: 0.6; transform: scale(1.02); }
      }
      ]]>
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#glow-bg)" />

  <!-- Animated Grid Lines -->
  <g class="line-h">
    <!-- Horizontal -->
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <!-- Vertical left / right margins -->
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="1120" y1="0" x2="1120" y2="400" />
  </g>

  <!-- Moving Glow on Grid -->
  <rect x="0" y="59.5" width="400" height="1" class="line-glow" style="animation: sweep 6s infinite linear;" />
  <rect x="0" y="339.5" width="400" height="1" class="line-glow" style="animation: sweep 8s infinite linear 2s;" />

  <!-- Geometric Accent Graphic on the Right -->
  <g transform="translate(900, 200)" filter="url(#bloom)">
    <!-- Rotating abstract shapes -->
    <g style="transform-origin: center; animation: orbit 20s infinite linear;">
      <circle cx="0" cy="0" r="120" stroke="#D4AF37" stroke-width="0.5" fill="none" opacity="0.3" stroke-dasharray="2 6" />
      <circle cx="0" cy="0" r="80" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.2" />
      <path d="M 0 -80 L 10 -70 L 0 -60 Z" fill="#D4AF37" opacity="0.8" />
    </g>
    <g style="transform-origin: center; animation: orbit 15s infinite reverse linear;">
      <circle cx="0" cy="0" r="160" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.1" stroke-dasharray="20 40" />
      <circle cx="0" cy="-160" r="3" fill="#FFFAED" opacity="0.6" />
    </g>
    <!-- Central Hexagon pulsating -->
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" stroke="url(#gold-grad)" stroke-width="2" fill="none" style="transform-origin: center; animation: pulse 4s infinite ease-in-out;"/>
    <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10" fill="url(#gold-grad)" style="transform-origin: center; animation: pulse 4s infinite ease-in-out reverse;" />
  </g>

  <!-- Typography Content -->
  <g transform="translate(120, 200)">
    
    <!-- Eyebrow Label -->
    <text x="0" y="-70" class="eyebrow">
      /// NEXT-GEN AI ENGINEERING
    </text>

    <!-- Main Title -->
    <g style="opacity: 0; animation: slideRight 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;">
      <text x="0" y="10" class="title">PYTHOUGHTS</text>
    </g>
    
    <!-- Subtitle -->
    <g style="opacity: 0; animation: slideRight 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;">
      <text x="0" y="60" class="subtitle">
        <tspan fill="#666">&gt;</tspan> AI Solutions for Developers Who Live in the Terminal<tspan class="cursor">_</tspan>
      </text>
    </g>

    <!-- Small Accent Line under text -->
    <rect x="0" y="100" width="60" height="2" fill="url(#gold-grad)" style="opacity: 0; animation: fadeIn 1s forwards 0.8s;" />
  </g>
  
  <!-- Corner Framers -->
  <g stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 30 30 L 60 30 M 30 30 L 30 60" />
    <path d="M 1170 30 L 1140 30 M 1170 30 L 1170 60" />
    <path d="M 30 370 L 60 370 M 30 370 L 30 340" />
    <path d="M 1170 370 L 1140 370 M 1170 370 L 1170 340" />
  </g>

  <!-- Tech Dots -->
  <circle cx="80" cy="60" r="3" fill="#D4AF37" opacity="0.6" />
  <circle cx="1120" cy="340" r="3" fill="#D4AF37" opacity="0.6" />
</svg>
