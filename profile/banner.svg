<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PyModel</title>
  <desc id="desc">PyModel, review-first AI engineering by Pythoughts</desc>

  <style>
    :root {
      --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }
    .rise {
      animation: rise 650ms var(--ease-expo) both;
    }
    .d1 { animation-delay: 80ms; }
    .d2 { animation-delay: 170ms; }
    .d3 { animation-delay: 260ms; }
    .d4 { animation-delay: 350ms; }
    .term { animation: fade 600ms var(--ease-expo) 300ms both; }
    .sweep { animation: sweep 1500ms var(--ease-expo) 400ms both; }
    .type-cover {
      transform-box: fill-box;
      transform-origin: right center;
      transform: scaleX(0);
      animation: type 1000ms steps(16, end) 1000ms both;
    }
    .out { animation: rise 380ms var(--ease-expo) both; }
    .o1 { animation-delay: 2150ms; }
    .o2 { animation-delay: 2280ms; }
    .o3 { animation-delay: 2410ms; }
    .o4 { animation-delay: 2540ms; }
    .prompt2 { animation: fade 350ms var(--ease-expo) 2750ms both; }
    .caret { animation: blink 1100ms steps(2, jump-none) 3100ms infinite; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes sweep {
      from { transform: translateX(-980px); }
      to   { transform: translateX(0); }
    }
    @keyframes type {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }
    @keyframes blink {
      0%, 49% { opacity: 0.9; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131318"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf4d4"/>
      <stop offset="0.42" stop-color="#f0d689"/>
      <stop offset="0.72" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a1801f"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0d689" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c766"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="wordGlow" cx="0.22" cy="0.52" r="0.55">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="panelClip">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="18"/>
    </clipPath>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#bg)" stroke="#2a2a32"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#wordGlow)"/>

  <!-- top gold hairline, one entrance sweep -->
  <g clip-path="url(#panelClip)">
    <rect class="sweep" x="120" y="0.5" width="960" height="1.5" fill="url(#hairline)"/>
  </g>

  <!-- left: wordmark block -->
  <g font-family="'Avenir Next','Helvetica Neue','Segoe UI',system-ui,sans-serif">
    <text class="rise d1" x="86" y="106" font-size="14" font-weight="600" letter-spacing="7" fill="#8f8f99">A&#160;&#160;PYTHOUGHTS&#160;&#160;COMPANY</text>
    <text class="rise d2" x="82" y="200" font-size="100" font-weight="800" letter-spacing="-2" fill="url(#gold)">PyModel</text>
    <rect class="rise d3" x="86" y="228" width="168" height="3" rx="1.5" fill="url(#rule)"/>
    <text class="rise d4" x="86" y="268" font-size="21" font-weight="500" fill="#c2c2cb">Review-first AI engineering for the terminal</text>
  </g>

  <!-- right: terminal motif -->
  <g class="term">
    <rect x="768" y="62" width="348" height="196" rx="12" fill="#0e0e13" stroke="#2a2a32"/>
    <line x1="768.5" y1="96" x2="1115.5" y2="96" stroke="#2a2a32"/>
    <circle cx="792" cy="79" r="4.5" fill="#35353f"/>
    <circle cx="811" cy="79" r="4.5" fill="#35353f"/>
    <circle cx="830" cy="79" r="4.5" fill="#35353f"/>

    <!-- prompt line with typing reveal -->
    <path d="M 794 118 L 803 126 L 794 134" fill="none" stroke="#e8c766" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="814" y="131" font-family="'SF Mono',Menlo,Consolas,'Cascadia Code',monospace" font-size="16" fill="#d8d8de">pythinker review</text>
    <rect class="type-cover" x="814" y="114" width="160" height="22" fill="#0e0e13"/>

    <!-- output lines -->
    <rect class="out o1" x="794" y="152" width="236" height="8" rx="4" fill="#2c2c36"/>
    <rect class="out o2" x="794" y="172" width="176" height="8" rx="4" fill="#2c2c36"/>
    <rect class="out o3" x="794" y="192" width="204" height="8" rx="4" fill="#4a4426"/>
    <rect class="out o4" x="794" y="212" width="140" height="8" rx="4" fill="#2c2c36"/>

    <!-- second prompt + blinking caret -->
    <g class="prompt2">
      <path d="M 794 230 L 803 238 L 794 246" fill="none" stroke="#e8c766" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="caret" x="814" y="228" width="11" height="19" rx="1.5" fill="#d4af37" opacity="0.9"/>
    </g>
  </g>
</svg>
