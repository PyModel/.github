<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pythoughts - AI Solutions for the Terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.5" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#FFFFFF" opacity="0.05">
    <circle cx="80" cy="60" r="2"/><circle cx="160" cy="60" r="2"/><circle cx="240" cy="60" r="2"/>
    <circle cx="1040" cy="260" r="2"/><circle cx="1120" cy="260" r="2"/><circle cx="1200" cy="260" r="2"/>
    <circle cx="1180" cy="80" r="2"/><circle cx="1100" cy="120" r="2"/><circle cx="120" cy="240" r="2"/>
  </g>

  <!-- glowing neural emblem -->
  <g transform="translate(160,160)" filter="url(#glow)">
    <circle r="78" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.85"/>
    <circle r="78" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.25" transform="scale(1.18)"/>
    <g stroke="url(#accent)" stroke-width="3" opacity="0.9">
      <line x1="0" y1="-46" x2="-34" y2="14"/>
      <line x1="0" y1="-46" x2="34" y2="14"/>
      <line x1="-34" y1="14" x2="34" y2="14"/>
      <line x1="-34" y1="14" x2="0" y2="44"/>
      <line x1="34" y1="14" x2="0" y2="44"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="0" cy="-46" r="8" fill="#22D3EE"/>
      <circle cx="-34" cy="14" r="8" fill="#A855F7"/>
      <circle cx="34" cy="14" r="8" fill="#EC4899"/>
      <circle cx="0" cy="44" r="8" fill="#6366F1"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="300" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="1">Pythoughts</text>
  <text x="302" y="200" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="600" fill="url(#accent)">AI Solutions for Developers Who Live in the Terminal</text>

  <!-- tagline pill -->
  <g transform="translate(302,228)">
    <rect width="320" height="40" rx="20" fill="#FFFFFF" opacity="0.08"/>
    <rect width="320" height="40" rx="20" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>
    <text x="24" y="26" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#E0E7FF">Think first, then code.</text>
  </g>

  <!-- accent bar -->
  <rect x="300" y="284" width="680" height="4" rx="2" fill="url(#accent)" opacity="0.7"/>
</svg>
