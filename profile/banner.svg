<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PyModel</title>
  <desc id="desc">PyModel, review-first AI engineering by Pythoughts</desc>

  <style>
    :root {
      --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }
    .rise {
      animation: rise 650ms var(--ease-expo) both;
    }
    .d1 { animation-delay: 80ms; }
    .d2 { animation-delay: 200ms; }
    .d3 { animation-delay: 320ms; }
    .mark polygon { animation: fade 450ms var(--ease-expo) both; }
    .mark polygon:nth-of-type(1)  { animation-delay: 80ms; }
    .mark polygon:nth-of-type(2)  { animation-delay: 135ms; }
    .mark polygon:nth-of-type(3)  { animation-delay: 190ms; }
    .mark polygon:nth-of-type(4)  { animation-delay: 245ms; }
    .mark polygon:nth-of-type(5)  { animation-delay: 300ms; }
    .mark polygon:nth-of-type(6)  { animation-delay: 355ms; }
    .mark polygon:nth-of-type(7)  { animation-delay: 410ms; }
    .mark polygon:nth-of-type(8)  { animation-delay: 465ms; }
    .mark polygon:nth-of-type(9)  { animation-delay: 520ms; }
    .mark polygon:nth-of-type(10) { animation-delay: 575ms; }
    .mark polygon:nth-of-type(11) { animation-delay: 630ms; }
    .mark polygon:nth-of-type(12) { animation-delay: 685ms; }
    .mark polygon:nth-of-type(13) { animation-delay: 740ms; }
    .mark polygon:nth-of-type(14) { animation-delay: 795ms; }
    .mark polygon:nth-of-type(15) { animation-delay: 850ms; }
    .term { animation: fade 600ms var(--ease-expo) 300ms both; }
    .sweep { animation: sweep 1500ms var(--ease-expo) 400ms both; }
    .type-cover {
      transform-box: fill-box;
      transform-origin: right center;
      transform: scaleX(0);
      animation: type 1000ms steps(16, end) 1000ms both;
    }
    .out { animation: rise 380ms var(--ease-expo) both; }
    .o1 { animation-delay: 2150ms; }
    .o2 { animation-delay: 2280ms; }
    .o3 { animation-delay: 2410ms; }
    .o4 { animation-delay: 2540ms; }
    .prompt2 { animation: fade 350ms var(--ease-expo) 2750ms both; }
    .caret { animation: blink 1100ms steps(2, jump-none) 3100ms infinite; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes sweep {
      from { transform: translateX(-980px); }
      to   { transform: translateX(0); }
    }
    @keyframes type {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }
    @keyframes blink {
      0%, 49% { opacity: 0.9; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a27"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>

    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cb7ff"/>
      <stop offset="0.5" stop-color="#6ba8ff"/>
      <stop offset="1" stop-color="#a891ff"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e2d0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6ba8ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a891ff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#6ba8ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6ba8ff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="panelClip">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="18"/>
    </clipPath>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#bg)" stroke="#2b3f54"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#glow)"/>

  <!-- top hairline, one entrance sweep -->
  <g clip-path="url(#panelClip)">
    <rect class="sweep" x="120" y="0.5" width="960" height="1.5" fill="url(#hairline)"/>
  </g>

  <!-- geodesic mark: 15-facet icosahedron projection -->
  <g class="mark" transform="translate(0,-7)" stroke="#071019" stroke-width="2" stroke-linejoin="round">
    <polygon points="158,160 158,122 121.9,148.3" fill="#6fe0d4"/>
    <polygon points="158,160 121.9,148.3 135.7,190.7" fill="#62b7e6"/>
    <polygon points="158,160 135.7,190.7 180.3,190.7" fill="#7d8df0"/>
    <polygon points="158,160 180.3,190.7 194.1,148.3" fill="#a891ff"/>
    <polygon points="158,160 194.1,148.3 158,122" fill="#7cb7ff"/>
    <polygon points="158,122 113.3,98.5 121.9,148.3" fill="#55d8c8"/>
    <polygon points="121.9,148.3 85.7,183.5 135.7,190.7" fill="#5794dc"/>
    <polygon points="135.7,190.7 158,236 180.3,190.7" fill="#6f7ae8"/>
    <polygon points="180.3,190.7 230.3,183.5 194.1,148.3" fill="#9a83f5"/>
    <polygon points="194.1,148.3 202.7,98.5 158,122" fill="#8ac2ff"/>
    <polygon points="113.3,98.5 121.9,148.3 85.7,183.5" fill="#49b9d4"/>
    <polygon points="85.7,183.5 135.7,190.7 158,236" fill="#4f7fd0"/>
    <polygon points="158,236 180.3,190.7 230.3,183.5" fill="#8a76ea"/>
    <polygon points="230.3,183.5 194.1,148.3 202.7,98.5" fill="#a98fff"/>
    <polygon points="202.7,98.5 158,122 113.3,98.5" fill="#6fd0e8"/>
  </g>

  <!-- lockup text -->
  <text class="rise d1" x="272" y="96" font-family="'SF Mono',Menlo,Consolas,'Cascadia Code',monospace" font-size="13" font-weight="700" letter-spacing="4" fill="#66e2d0">A PYTHOUGHTS COMPANY</text>
  <text class="rise d2" x="268" y="188" font-family="'Avenir Next','Futura','Century Gothic','Helvetica Neue','Segoe UI',system-ui,sans-serif" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#word)">PyModel</text>
  <text class="rise d3" x="272" y="236" font-family="'Avenir Next','Helvetica Neue','Segoe UI',system-ui,sans-serif" font-size="20" font-weight="500" fill="#b5c3d0">Review-first AI engineering for the terminal</text>

  <!-- right: terminal motif -->
  <g class="term">
    <rect x="768" y="62" width="348" height="196" rx="12" fill="#060f18" stroke="#2b3f54"/>
    <line x1="768.5" y1="96" x2="1115.5" y2="96" stroke="#2b3f54"/>
    <circle cx="792" cy="79" r="4.5" fill="#35455a"/>
    <circle cx="811" cy="79" r="4.5" fill="#35455a"/>
    <circle cx="830" cy="79" r="4.5" fill="#35455a"/>

    <!-- prompt line with typing reveal -->
    <path d="M 794 118 L 803 126 L 794 134" fill="none" stroke="#66e2d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="814" y="131" font-family="'SF Mono',Menlo,Consolas,'Cascadia Code',monospace" font-size="16" fill="#dfeaf3">pythinker review</text>
    <rect class="type-cover" x="814" y="114" width="160" height="22" fill="#060f18"/>

    <!-- output lines -->
    <rect class="out o1" x="794" y="152" width="236" height="8" rx="4" fill="#263a4d"/>
    <rect class="out o2" x="794" y="172" width="176" height="8" rx="4" fill="#263a4d"/>
    <rect class="out o3" x="794" y="192" width="204" height="8" rx="4" fill="#564d85"/>
    <rect class="out o4" x="794" y="212" width="140" height="8" rx="4" fill="#263a4d"/>

    <!-- second prompt + blinking caret -->
    <g class="prompt2">
      <path d="M 794 230 L 803 238 L 794 246" fill="none" stroke="#66e2d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="caret" x="814" y="228" width="11" height="19" rx="1.5" fill="#6ba8ff" opacity="0.9"/>
    </g>
  </g>
</svg>
