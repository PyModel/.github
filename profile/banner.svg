<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PyModel</title>
  <desc id="desc">PyModel, review-first AI engineering by Pythoughts</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111116"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3ae"/>
      <stop offset="0.45" stop-color="#e8c766"/>
      <stop offset="0.75" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b3892a"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8c766" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c766"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="wordGlow" cx="0.24" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#d4af37" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#bg)" stroke="#2c2c34"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#wordGlow)"/>
  <!-- top gold hairline -->
  <rect x="120" y="0.5" width="960" height="1.5" fill="url(#hairline)"/>

  <!-- left: wordmark block -->
  <g font-family="'Avenir Next','Helvetica Neue','Segoe UI',system-ui,sans-serif">
    <text x="86" y="108" font-size="15" font-weight="600" letter-spacing="6.5" fill="#9a9aa3">A&#160;&#160;PYTHOUGHTS&#160;&#160;COMPANY</text>
    <text x="82" y="200" font-size="96" font-weight="800" letter-spacing="-1" fill="url(#gold)">PyModel</text>
    <rect x="86" y="228" width="168" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="86" y="268" font-size="21" font-weight="500" fill="#c6c6ce">Review-first AI engineering for the terminal</text>
  </g>

  <!-- right: terminal motif -->
  <g>
    <rect x="768" y="62" width="348" height="196" rx="12" fill="#0e0e13" stroke="#2c2c34"/>
    <line x1="768.5" y1="98" x2="1115.5" y2="98" stroke="#2c2c34"/>
    <circle cx="792" cy="80" r="5" fill="#3a3a44"/>
    <circle cx="812" cy="80" r="5" fill="#3a3a44"/>
    <circle cx="832" cy="80" r="5" fill="#3a3a44"/>

    <!-- prompt chevron, drawn (no glyph dependency) -->
    <path d="M 794 120 L 803 128 L 794 136" fill="none" stroke="#e8c766" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="814" y="133" font-family="'SF Mono',Menlo,Consolas,'Cascadia Code',monospace" font-size="16" fill="#d8d8de">pythinker review</text>

    <!-- output lines -->
    <rect x="794" y="152" width="236" height="8" rx="4" fill="#2e2e38"/>
    <rect x="794" y="172" width="176" height="8" rx="4" fill="#2e2e38"/>
    <rect x="794" y="192" width="204" height="8" rx="4" fill="#40402e"/>
    <rect x="794" y="212" width="140" height="8" rx="4" fill="#2e2e38"/>

    <!-- prompt + cursor -->
    <path d="M 794 230 L 803 238 L 794 246" fill="none" stroke="#e8c766" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="814" y="228" width="11" height="19" rx="1.5" fill="#d4af37" opacity="0.9"/>
  </g>
</svg>
