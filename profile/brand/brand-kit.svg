<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PyModel brand system</title>
  <desc id="desc">Identity overview board: mark, construction, digital application, essence, color, typography, physical application, image direction, and system detail</desc>

  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e8fe8"/>
      <stop offset="1" stop-color="#7b63e6"/>
    </linearGradient>
    <linearGradient id="rimG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27d5c9"/>
      <stop offset="0.5" stop-color="#2e8fe8"/>
      <stop offset="1" stop-color="#7b63e6"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#27d5c9"/>
      <stop offset="0.5" stop-color="#2e8fe8"/>
      <stop offset="1" stop-color="#7b63e6"/>
    </linearGradient>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#1a1f3d"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soft8" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04" intercept="0"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#eaf2ff" opacity="0.10"/>
    </pattern>

    <!-- geodesic mark, centered at 0,0; spans x -66.6..66.6, y -70..70 -->
    <g id="mk" stroke="#0b0c10" stroke-width="3" stroke-linejoin="round">
      <polygon points="-4,2 0,-38 -36.1,-11.7" fill="#46b8e0"/>
      <polygon points="-4,2 -36.1,-11.7 -22.3,30.7" fill="#7d8bf0"/>
      <polygon points="-4,2 -22.3,30.7 22.3,30.7" fill="#4a4fb5"/>
      <polygon points="-4,2 22.3,30.7 36.1,-11.7" fill="#7b63e6"/>
      <polygon points="-4,2 36.1,-11.7 0,-38" fill="#64b1f0"/>
      <polygon points="0,-38 -36.1,-11.7 -41.1,-56.6" fill="#5a9fe8"/>
      <polygon points="-36.1,-11.7 -22.3,30.7 -66.6,21.6" fill="#6d6fd6"/>
      <polygon points="-22.3,30.7 22.3,30.7 0,70" fill="#3f8fd9"/>
      <polygon points="22.3,30.7 36.1,-11.7 66.6,21.6" fill="#8f7aec"/>
      <polygon points="36.1,-11.7 0,-38 41.1,-56.6" fill="#45d3c9"/>
      <polygon points="0,-38 41.1,-56.6 0,-70" fill="#52dfc0"/>
      <polygon points="0,-38 0,-70 -41.1,-56.6" fill="#6f7fe0"/>
      <polygon points="-36.1,-11.7 -41.1,-56.6 -66.6,-21.6" fill="#6076d8"/>
      <polygon points="-36.1,-11.7 -66.6,-21.6 -66.6,21.6" fill="#5b74d6"/>
      <polygon points="-22.3,30.7 -66.6,21.6 -41.1,56.6" fill="#3ecfbf"/>
      <polygon points="-22.3,30.7 -41.1,56.6 0,70" fill="#4b57b0"/>
      <polygon points="22.3,30.7 0,70 41.1,56.6" fill="#4a90d9"/>
      <polygon points="22.3,30.7 41.1,56.6 66.6,21.6" fill="#6a52d8"/>
      <polygon points="36.1,-11.7 66.6,21.6 66.6,-21.6" fill="#58c4d4"/>
      <polygon points="36.1,-11.7 66.6,-21.6 41.1,-56.6" fill="#55c9e6"/>
    </g>
    <polygon id="hull" points="0,-70 41.1,-56.6 66.6,-21.6 66.6,21.6 41.1,56.6 0,70 -41.1,56.6 -66.6,21.6 -66.6,-21.6 -41.1,-56.6"/>
  </defs>

  <!-- canvas -->
  <rect width="1600" height="1000" fill="#0d0e13"/>

  <!-- ================= row 1 ================= -->

  <!-- 01 logo cover -->
  <g transform="translate(40,40)">
    <rect width="492" height="290" rx="14" fill="#12141c" stroke="#1e2430"/>
    <text x="24" y="34" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">01 &#183; MARK</text>
    <use xlink:href="#hull" transform="translate(246,124) scale(0.78)" fill="none" stroke="url(#rimG)" stroke-width="3" stroke-linejoin="round" filter="url(#soft)" opacity="0.6"/>
    <use xlink:href="#mk" transform="translate(246,124) scale(0.78)"/>
    <text x="246" y="252" text-anchor="middle" font-family="'Poppins','Avenir Next','Helvetica Neue',sans-serif" font-size="40" font-weight="700" letter-spacing="-1" fill="url(#word)">PyModel</text>
  </g>

  <!-- 02 construction -->
  <g transform="translate(554,40)">
    <rect width="492" height="290" rx="14" fill="#12141c" stroke="#1e2430"/>
    <text x="24" y="34" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">02 &#183; CONSTRUCTION</text>
    <g transform="translate(246,148)">
      <line x1="-110" y1="0" x2="110" y2="0" stroke="#222a3a"/>
      <line x1="0" y1="-100" x2="0" y2="100" stroke="#222a3a"/>
      <circle r="59.5" fill="none" stroke="#2a3244" stroke-dasharray="3 4"/>
      <circle r="32.3" fill="none" stroke="#2a3244" stroke-dasharray="3 4"/>
      <g transform="scale(0.85)" fill="none" stroke="#3d4a66" stroke-width="1.5" stroke-linejoin="round">
        <use xlink:href="#hull"/>
        <polygon points="0,-38 36.1,-11.7 22.3,30.7 -22.3,30.7 -36.1,-11.7"/>
        <path d="M-4,2 L0,-38 M-4,2 L-36.1,-11.7 M-4,2 L-22.3,30.7 M-4,2 L22.3,30.7 M-4,2 L36.1,-11.7"/>
        <path d="M0,-38 L-41.1,-56.6 M0,-38 L0,-70 M0,-38 L41.1,-56.6 M-36.1,-11.7 L-41.1,-56.6 M-36.1,-11.7 L-66.6,-21.6 M-36.1,-11.7 L-66.6,21.6 M-22.3,30.7 L-66.6,21.6 M-22.3,30.7 L-41.1,56.6 M-22.3,30.7 L0,70 M22.3,30.7 L0,70 M22.3,30.7 L41.1,56.6 M22.3,30.7 L66.6,21.6 M36.1,-11.7 L66.6,21.6 M36.1,-11.7 L66.6,-21.6 M36.1,-11.7 L41.1,-56.6"/>
      </g>
      <g fill="#27d5c9">
        <circle cx="0" cy="-59.5" r="2"/><circle cx="34.9" cy="-48.1" r="2"/><circle cx="56.6" cy="-18.4" r="2"/><circle cx="56.6" cy="18.4" r="2"/><circle cx="34.9" cy="48.1" r="2"/><circle cx="0" cy="59.5" r="2"/><circle cx="-34.9" cy="48.1" r="2"/><circle cx="-56.6" cy="18.4" r="2"/><circle cx="-56.6" cy="-18.4" r="2"/><circle cx="-34.9" cy="-48.1" r="2"/>
      </g>
      <g fill="#7b63e6">
        <circle cx="0" cy="-32.3" r="2"/><circle cx="-30.7" cy="-9.9" r="2"/><circle cx="-19" cy="26.1" r="2"/><circle cx="19" cy="26.1" r="2"/><circle cx="30.7" cy="-9.9" r="2"/>
      </g>
      <text x="64" y="-56" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#566078">R</text>
      <text x="36" y="-30" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#566078">0.54R</text>
    </g>
    <text x="246" y="274" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">20 FACETS &#183; 10 VERTICES &#183; 36&#176; STEP</text>
  </g>

  <!-- 03 digital application -->
  <g transform="translate(1068,40)">
    <rect width="492" height="290" rx="14" fill="#12141c" stroke="#1e2430"/>
    <text x="24" y="34" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">03 &#183; DIGITAL</text>
    <rect x="48" y="58" width="396" height="196" rx="10" fill="#0e1016" stroke="#262a38"/>
    <line x1="48.5" y1="90" x2="443.5" y2="90" stroke="#262a38"/>
    <circle cx="70" cy="74" r="4" fill="#333848"/>
    <circle cx="87" cy="74" r="4" fill="#333848"/>
    <circle cx="104" cy="74" r="4" fill="#333848"/>
    <path d="M 66 108 L 74 115 L 66 122" fill="none" stroke="#27d5c9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="119" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#dde7f5">pythinker review</text>
    <rect x="66" y="138" width="220" height="7" rx="3.5" fill="#2a2f40"/>
    <rect x="66" y="156" width="150" height="7" rx="3.5" fill="#2a2f40"/>
    <rect x="66" y="174" width="180" height="7" rx="3.5" fill="#4a4090"/>
    <rect x="66" y="192" width="120" height="7" rx="3.5" fill="#2a2f40"/>
    <path d="M 66 214 L 74 221 L 66 228" fill="none" stroke="#27d5c9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="84" y="212" width="9" height="16" rx="1.5" fill="#2e8fe8" opacity="0.9"/>
  </g>

  <!-- ================= row 2 ================= -->

  <!-- 04 essence -->
  <g transform="translate(40,352)">
    <rect width="492" height="290" rx="14" fill="#12141c" stroke="#1e2430"/>
    <text x="24" y="34" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">04 &#183; ESSENCE</text>
    <text x="44" y="148" font-family="'Poppins','Avenir Next','Helvetica Neue',sans-serif" font-size="50" font-weight="700" letter-spacing="-1.5" fill="#eaf2ff">Think first,</text>
    <text x="44" y="210" font-family="'Poppins','Avenir Next','Helvetica Neue',sans-serif" font-size="50" font-weight="700" letter-spacing="-1.5" fill="url(#word)">then code.</text>
    <text x="44" y="262" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">PYTHOUGHTS.COM</text>
  </g>

  <!-- 05 color system -->
  <g transform="translate(554,352)">
    <rect width="492" height="290" rx="14" fill="#12141c" stroke="#1e2430"/>
    <text x="24" y="34" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">05 &#183; COLOR</text>
    <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10">
      <rect x="34" y="62" width="140" height="88" rx="10" fill="#eaf2ff"/>
      <text x="164" y="140" text-anchor="end" fill="#0b0c10">#EAF2FF</text>
      <rect x="182" y="62" width="140" height="88" rx="10" fill="#27d5c9"/>
      <text x="312" y="140" text-anchor="end" fill="#0b0c10">#27D5C9</text>
      <rect x="330" y="62" width="140" height="88" rx="10" fill="#2e8fe8"/>
      <text x="460" y="140" text-anchor="end" fill="#eaf2ff">#2E8FE8</text>
      <rect x="34" y="164" width="140" height="88" rx="10" fill="#3b3f9e"/>
      <text x="164" y="242" text-anchor="end" fill="#eaf2ff">#3B3F9E</text>
      <rect x="182" y="164" width="140" height="88" rx="10" fill="#7b63e6"/>
      <text x="312" y="242" text-anchor="end" fill="#eaf2ff">#7B63E6</text>
      <rect x="330" y="164" width="140" height="88" rx="10" fill="#0b0c10" stroke="#262a38"/>
      <text x="460" y="242" text-anchor="end" fill="#eaf2ff">#0B0C10</text>
    </g>
  </g>

  <!-- 06 typography -->
  <g transform="translate(1068,352)">
    <rect width="492" height="290" rx="14" fill="#12141c" stroke="#1e2430"/>
    <text x="24" y="34" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">06 &#183; TYPE</text>
    <text x="44" y="140" font-family="'Poppins','Avenir Next','Helvetica Neue',sans-serif" font-size="84" font-weight="700" fill="#eaf2ff">Abcd</text>
    <text x="46" y="164" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">POPPINS BOLD</text>
    <text x="44" y="218" font-family="'Poppins','Avenir Next','Helvetica Neue',sans-serif" font-size="38" font-weight="400" fill="#b8c4da">Abcd</text>
    <text x="46" y="240" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">POPPINS REGULAR</text>
    <text x="44" y="268" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#7f8aa3">SF MONO &#183; 0123456789</text>
  </g>

  <!-- ================= row 3 ================= -->

  <!-- 07 physical -->
  <g transform="translate(40,664)">
    <rect width="492" height="290" rx="14" fill="#12141c" stroke="#1e2430"/>
    <text x="24" y="34" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">07 &#183; PHYSICAL</text>
    <rect x="36" y="82" width="270" height="160" rx="12" fill="#0e1016" stroke="#262a38"/>
    <rect x="48" y="82" width="246" height="2" fill="url(#hairG)" opacity="0.8"/>
    <use xlink:href="#mk" transform="translate(80,138) scale(0.32)"/>
    <text x="58" y="212" font-family="'Poppins','Avenir Next','Helvetica Neue',sans-serif" font-size="18" font-weight="700" fill="#eaf2ff">PyModel</text>
    <text x="58" y="228" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="8" letter-spacing="1.5" fill="#566078">PYTHOUGHTS.COM</text>
    <circle cx="394" cy="162" r="52" fill="#0e1016" stroke="url(#rimG)" stroke-width="2"/>
    <use xlink:href="#mk" transform="translate(394,160) scale(0.42)"/>
  </g>

  <!-- 08 image direction -->
  <g transform="translate(554,664)">
    <clipPath id="p8clip"><rect width="492" height="290" rx="14"/></clipPath>
    <g clip-path="url(#p8clip)">
      <rect width="492" height="290" fill="url(#skyG)"/>
      <circle cx="380" cy="382" r="200" fill="none" stroke="url(#rimG)" stroke-width="4" filter="url(#soft8)" opacity="0.85"/>
      <circle cx="380" cy="382" r="200" fill="none" stroke="url(#rimG)" stroke-width="1" opacity="0.5"/>
      <rect width="246" height="290" fill="url(#halftone)"/>
      <rect width="492" height="290" fill="#eaf2ff" filter="url(#grain)"/>
    </g>
    <rect width="492" height="290" rx="14" fill="none" stroke="#1e2430"/>
    <text x="24" y="34" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#8a94ab">08 &#183; IMAGE</text>
  </g>

  <!-- 09 system detail -->
  <g transform="translate(1068,664)">
    <rect width="492" height="290" rx="14" fill="#12141c" stroke="#1e2430"/>
    <text x="24" y="34" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">09 &#183; SYSTEM</text>
    <rect x="44" y="64" width="212" height="26" rx="13" fill="none" stroke="#27d5c9" opacity="0.7"/>
    <text x="150" y="81" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" letter-spacing="2" fill="#27d5c9">A PYTHOUGHTS COMPANY</text>
    <rect x="44" y="112" width="126" height="36" rx="18" fill="#2e8fe8"/>
    <text x="107" y="135" text-anchor="middle" font-family="'Poppins','Avenir Next','Helvetica Neue',sans-serif" font-size="13" font-weight="500" fill="#eaf2ff">Get started</text>
    <rect x="182" y="112" width="84" height="36" rx="18" fill="none" stroke="#2c3346"/>
    <text x="224" y="135" text-anchor="middle" font-family="'Poppins','Avenir Next','Helvetica Neue',sans-serif" font-size="13" font-weight="500" fill="#b8c4da">Docs</text>
    <use xlink:href="#mk" transform="translate(60,196) scale(0.12)"/>
    <use xlink:href="#mk" transform="translate(102,196) scale(0.18)"/>
    <use xlink:href="#mk" transform="translate(156,196) scale(0.26)"/>
    <text x="200" y="200" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9" letter-spacing="1.5" fill="#566078">16 / 24 / 32</text>
    <rect x="44" y="228" width="300" height="40" rx="10" fill="#0e1016" stroke="#262a38"/>
    <path d="M 62 241 L 70 248 L 62 255" fill="none" stroke="#27d5c9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="253" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#dde7f5">pythinker</text>
    <rect x="158" y="238" width="9" height="17" rx="1.5" fill="#2e8fe8" opacity="0.9"/>
  </g>

  <!-- footer -->
  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="2" fill="#566078">
    <text x="40" y="984">PYMODEL BRAND SYSTEM</text>
    <text x="800" y="984" text-anchor="middle">IDENTITY OVERVIEW</text>
    <text x="1560" y="984" text-anchor="end">01 / 01</text>
  </g>
</svg>
